name: 'dbt_databricks_demo'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_databricks_demo:
    src:
      +materialized: table
      load_all_sources:
        +pre-hook: "{{ create_volume_sources() }}"
    dim:
      +materialized: table
      +schema: silver
